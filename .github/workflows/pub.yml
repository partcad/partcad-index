# Tests and renders every package of the index (//pub) with one PartCAD.
# Called by "devel.yml" (pull requests, PartCAD's 'devel' branch) and
# "main.yml" (pushes, the latest PartCAD on PyPI).
#
#   Plan    pins the PartCAD every job below installs, lists the packages of
#           //pub with it, and splits that list into shards: LDraw in a shard
#           of its own, everything else in contiguous ranges balanced by how
#           long each package took (".github/scripts/pub_weights.json").
#   Shards  one job per shard, operating system and Python: 'pc test' and
#           'pc render' with '--fast-only' on each package of the shard.
#   Result  the one check to require in branch protection.
#
# The operating systems and Pythons default to the matrix PartCAD's own CI runs
# "Repo //pub" on at its "deep" level: OSES_SLIM x PYTHONS_SANDBOX in
# partcad/partcad's ".github/workflows/test.yml". Keep the two in step.
#
# LDraw (//pub/universe/lego/ldraw, some twenty thousand parts) is a shard of
# its own because nothing else would fit beside it: at the rate it is tested
# today it does not fit in one job either, and is being made faster.
name: Test //pub

on:
  workflow_call:
    inputs:
      partcad:
        description: "Which PartCAD: 'devel' (the tip of its devel branch) or 'pypi' (the latest release)"
        type: string
        required: true
      shards:
        description: How many ranges to split the packages of //pub into, besides LDraw's own shard
        type: number
        default: 6
      oses:
        description: JSON list of the runner images to test on
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

permissions:
  contents: read

env:
  PYTHONS: '["3.11", "3.14"]'
  PC_TELEMETRY_ENV: test
  PC_TELEMETRY_PERFORMANCE: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      partcad-ref: ${{ steps.partcad.outputs.ref }}
      partcad-version: ${{ steps.partcad.outputs.version }}
      matrix: ${{ steps.shards.outputs.matrix }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # One PartCAD for the whole run, so that a push to PartCAD's 'devel' or a
      # release while the shards run cannot test half of //pub with another.
      - name: Pin PartCAD
        id: partcad
        shell: bash
        env:
          PARTCAD: ${{ inputs.partcad }}
        run: |
          case "${PARTCAD}" in
          devel)
            ref="$(git ls-remote https://github.com/partcad/partcad.git refs/heads/devel | cut -f1)"
            [ -n "${ref}" ] || { echo "::error::Could not resolve partcad/partcad@devel"; exit 1; }
            echo "PartCAD: partcad/partcad@${ref}"
            echo "ref=${ref}" >>"${GITHUB_OUTPUT}"
            ;;
          pypi)
            version="$(curl -fsSL https://pypi.org/pypi/partcad/json | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"
            echo "PartCAD: ${version} from PyPI"
            echo "version=${version}" >>"${GITHUB_OUTPUT}"
            ;;
          *)
            echo "::error::Unknown 'partcad' input '${PARTCAD}': expected 'devel' or 'pypi'"
            exit 1
            ;;
          esac

      # Into a directory of its own: a 'partcad.yaml' anywhere below the index's
      # root -- PartCAD's checkout has several -- would be a package of //pub.
      - uses: actions/checkout@v7
        with:
          path: index
          persist-credentials: false

      - uses: ./index/.github/actions/setup-partcad
        with:
          python-version: "3.14"
          partcad-ref: ${{ steps.partcad.outputs.ref }}
          partcad-version: ${{ steps.partcad.outputs.version }}

      # The packages with something to test or render, as PartCAD sees them.
      # A package that cannot be loaded is missing from the list, so a listing
      # that fails fails the run -- but only after the shards are planned, so
      # that the rest of //pub is still tested and reported.
      - name: List the packages of //pub
        id: shards
        working-directory: index
        env:
          COLUMNS: "500"
          SHARDS: ${{ inputs.shards }}
          OSES: ${{ inputs.oses }}
        run: |
          set +e
          pc --no-ansi list packages -r >../packages.log 2>&1
          list_rc=$?
          set -e
          cat ../packages.log
          python -I .github/scripts/pub_shards.py --shards "${SHARDS}" \
            --own-shard //pub/universe/lego/ldraw --weights .github/scripts/pub_weights.json \
            --os "${OSES}" --python "${PYTHONS}" <../packages.log >>"${GITHUB_OUTPUT}"
          if [ "${list_rc}" -ne 0 ]; then
            echo "::error title=pc list packages::exited ${list_rc}: the packages it could not load are not tested by any shard"
            exit "${list_rc}"
          fi

  shard:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}, shard ${{ matrix.shard.label }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          path: index
          persist-credentials: false

      - uses: ./index/.github/actions/setup-partcad
        with:
          python-version: ${{ matrix.python-version }}
          partcad-ref: ${{ needs.plan.outputs.partcad-ref }}
          partcad-version: ${{ needs.plan.outputs.partcad-version }}

      - name: pc test and pc render
        working-directory: index
        env:
          PACKAGES: ${{ matrix.shard.packages }}
        run: bash .github/scripts/pub_shard.sh

  result:
    name: Result
    if: ${{ always() }}
    needs: [plan, shard]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "Plan: ${PLAN}, shards: ${SHARDS}"
          [ "${PLAN}" = "success" ] && [ "${SHARDS}" = "success" ]
