desc: |
  Collections of models other people have published, each served as PartCAD
  parts by a repository plugin, with no geometry vendored. On a model site
  nothing is listed: a part is asked for by the site's own number or slug for a
  model, found with 'pc search parts', and fetched from the site when it is
  first built. The OpenUSD asset libraries, in 'openusd', are listed as well. An
  upload to a model site says nothing about whether, or how, it is made to be
  manufactured, and a USD asset is made to be looked at, so none of these
  packages is manufacturable.

# Each package below is one model site. Its parts are the models of its
# external dependency 'models', //pub/collection/<site>/models:<model id>, and
# its repository plugin is //pub/collection/<site>:<site>_repo - the name that
# 'pc login' and the 'parameters' of ~/.partcad/config.yaml use, by its place
# here. Every one of them needs PartCAD 0.9.20 or newer: the first release with
# the toolkit these plugins are written with ('plugin_models', one of PartCAD's
# wrappers), which hands a repository plugin the key it is asked for already
# taken apart ('query').
dependencies:
  # Free models need no account at all, paid ones their buyer's 'pc login'.
  printables:
    desc: Models on Printables, a part per file, by the model's number.
    type: git
    url: https://github.com/partcad/partcad-repo-printables
    track: main
    revision: 58312596b18ea94ada92af19dd5a664a8a3dc3a2
  # A model's details and each print profile's preview mesh need no account;
  # the files the designer uploaded take a MakerWorld (Bambu Lab) sign-in.
  makerworld:
    desc: Models on MakerWorld, a part per file, by the model's number.
    type: git
    url: https://github.com/partcad/partcad-repo-makerworld
    track: main
    revision: a6ebed23c2f7b5d2353ac4878d3d01de1cfa4b59
  # Details and search need no account; downloading takes a GrabCAD sign-in.
  grabcad:
    desc: Models in the GrabCAD Library, a part per file, by the model's slug.
    type: git
    url: https://github.com/partcad/partcad-repo-grabcad
    track: main
    revision: 55f8e38bf39b005dd8ffef6e8b6556adb463d48f
  # Everything takes a token from the user's own Thingiverse app.
  thingiverse:
    desc: Things on Thingiverse, a part per file, by the thing's number.
    type: git
    url: https://github.com/partcad/partcad-repo-thingiverse
    track: main
    revision: 89cf663e3775c8ba31d00ea57ecaa62d88feed16
  # Everything takes a Cults3D API key, and a creation's files are given to
  # its creator only.
  cults3d:
    desc: Creations on Cults3D, by the creation's slug.
    type: git
    url: https://github.com/partcad/partcad-repo-cults3d
    track: main
    revision: cde2e273e65f1febe49ce32834044eb120892c4d
  # Details and search need no account; every download takes the user's own
  # Sketchfab API token (or an OAuth application of their own), and only
  # models their author made downloadable can be had.
  sketchfab:
    desc: Models on Sketchfab, a part per file, by the model's uid.
    type: git
    url: https://github.com/partcad/partcad-repo-sketchfab
    track: main
    revision: e630a4fc9c6b7480d2df32a5925c561726f10ec2
