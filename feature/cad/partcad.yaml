dependencies:
  cadcraft:
    desc: AutoCAD drawings (DWG and DXF) read as parts and as assemblies, objects rendered as DWG or DXF drawings, and drawings opened in CADCraft.
    type: git
    url: https://github.com/partcad/partcad-cadcraft
    track: main
    revision: 45e1e8474ef2990225a4584a954c1d95c4c32521
    web: https://github.com/storytold/cadcraft
  solidcraft:
    desc: Parts read from SolidCraft designs, Rhino and IGES files, and objects exported to and edited in SolidCraft.
    type: git
    url: https://github.com/partcad/partcad-solidcraft
    track: main
    revision: 42162b0027a26fc8c5b6288782f47193ba08ecb0
    web: https://github.com/bherbruck/solidcraft
  csgrs:
    desc: Gears, racks, TPMS lattices, NACA airfoils, single-stroke and TrueType text, traced images, VRML models and CSG trees built by the csgrs kernel -- as parts, and as sketches -- and hyperdrc's PCB design-readiness checks as a qualification test.
    type: git
    url: https://github.com/partcad/partcad-csgrs
    track: main
    revision: 9462c7ea8bf3aa6af9c182306816e727a1af9839
    web: https://github.com/timschmidt/csgrs
