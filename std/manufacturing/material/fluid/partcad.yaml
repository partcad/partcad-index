# The package path this catalogue is published at, so that standalone
# development uses the very same addresses its consumers will.
name: //pub/std/manufacturing/material/fluid

# 'materials:' is only read by the PartCAD that has the material object type.
# 'viscosity', and a scene's 'medium:' that names one of these, are read from
# the release carrying partcad/partcad#757 (scenes state their gravity and the
# fluid they are filled with); an older one reads the density and ignores the
# rest, which is harmless, so the floor stays where the object type put it.
partcad: ">=0.8.46"

desc: Standard fluids - air, fresh water and seawater - as PartCAD materials.

# What these are for. A part is rarely made of water; a *scene* is often filled
# with it. A scene names the fluid it is filled with the way a part names what it
# is made of - 'medium: //pub/std/manufacturing/material/fluid:seawater' - and a
# simulation of that scene drags and buoys what moves through it with the two
# facts below. A scene that names none is a vacuum, which is what every engine
# assumes, so there is deliberately no 'vacuum' here: it is the absence of a
# medium, not a substance with a density of zero.
#
# Three conventions this file keeps, so that a reader does not have to work them
# out from the entries:
#
# * 'density' is g/mm^3, which is what PartCAD computes with everywhere. A
#   datasheet quotes kg/m^3, a million times larger: water at 999.1 kg/m^3 is
#   0.0009991 here.
#
# * 'viscosity' is the *dynamic* viscosity, in g/(mm*s) - the units 'density' is
#   in - which is numerically the same as Pa*s, the unit a datasheet quotes.
#   Water at 15 C is 0.001138 in both.
#
# * Every value is at one temperature, 15 C, and at sea-level pressure, so that
#   the three can be compared and so that each is the reference a field already
#   uses: the ICAO standard atmosphere for air, and the ITTC's reference
#   properties for fresh water and seawater, which are what towing tanks and
#   ship-model tests are corrected to. A fluid at another temperature is another
#   material; a package that needs warm water catalogues its own and names it.
materials:
  air:
    formal: Air
    full: Air at sea level (ICAO standard atmosphere, 15 C, 101.325 kPa)
    desc: |
      Dry air under the ICAO standard atmosphere at mean sea level. Its
      buoyancy is a fraction of a percent of what almost anything solid
      weighs, so what it does to a simulation is drag: a part dropped through it falls a
      little slower than in a vacuum, and a light, broad one - a sheet, a
      propeller blade - a lot slower. A scene with no medium is a vacuum, not
      this; name it when the drag matters.
    url: https://en.wikipedia.org/wiki/International_Standard_Atmosphere
    density: 1.225e-6 # g/mm^3, i.e. 1.225 kg/m^3
    viscosity: 1.7894e-5 # g/(mm*s), i.e. Pa*s
    tags:
      - fluid
      - gas
      - air
  water:
    formal: H2O
    full: Fresh water at 15 C
    desc: |
      Fresh water at 15 C and atmospheric pressure, as tabulated by the ITTC
      for model tests in a towing tank. What a part made of something denser
      sinks in and something lighter rises through; a tank, a pool, a river.
      Seawater is denser by about 2.7 percent, which is the difference between
      a neutrally buoyant vehicle trimmed in one floating or sinking in the
      other.
    url: https://www.ittc.info/media/11764/75-02-01-03.pdf
    density: 0.0009991 # g/mm^3, i.e. 999.1 kg/m^3
    viscosity: 0.001138 # g/(mm*s), i.e. Pa*s
    tags:
      - fluid
      - liquid
      - water
  seawater:
    formal: Seawater
    full: Standard seawater at 15 C (absolute salinity 35.165 g/kg)
    desc: |
      Standard seawater - practical salinity 35, absolute salinity
      35.16504 g/kg - at 15 C and atmospheric pressure, as tabulated by the
      ITTC. The reference ocean: what an underwater vehicle, a buoy or a hull
      is ballasted against, unless it is meant for a sea that is fresher or
      saltier than this.
    url: https://www.ittc.info/media/11764/75-02-01-03.pdf
    density: 0.001026 # g/mm^3, i.e. 1026.0 kg/m^3
    viscosity: 0.001220 # g/(mm*s), i.e. Pa*s
    tags:
      - fluid
      - liquid
      - water
      - marine
