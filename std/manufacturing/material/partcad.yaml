desc: |
  What parts are made of, and what scenes are filled with. A package here
  catalogues materials, which parts refer to by their "material" parameter and
  scenes by their "medium" as //pub/std/manufacturing/material/<family>:<name>.
cover:
  package: plastic

dependencies:
  plastic:
    desc: Standard polymers (thermoplastics, composites, elastomers)
    type: git
    url: https://github.com/partcad/std-manufacturing-materials-plastic
  metal:
    desc: Standard metals and alloys (aluminium, steel, stainless, titanium, magnesium, copper, nickel)
    type: git
    url: https://github.com/partcad/std-manufacturing-materials-metals

# 'fluid' is the third family - air, fresh water and seawater, what a scene is
# filled with rather than what a part is made of - and it is a sub-directory
# here rather than a dependency on a repository of its own only because there is
# no such repository yet. A sub-directory holding a 'partcad.yaml' is a package
# of this index like any other, so the catalogue already answers to
# //pub/std/manufacturing/material/fluid - which is the same address it answers
# to the day it moves out into a repository beside the other two, as 'metal'
# did. Moving it is then one 'dependencies:' entry and a deleted directory, and
# nothing that names a fluid changes.
