desc: |
  What parts are made of. A package here catalogues materials, which parts
  refer to by their "material" parameter as //pub/std/manufacturing/material/<family>:<name>.
cover:
  package: plastic

dependencies:
  plastic:
    desc: Standard polymers (thermoplastics, composites, elastomers)
    type: git
    url: https://github.com/partcad/std-manufacturing-materials-plastic
  metal:
    desc: Standard metals and alloys (aluminium, steel, stainless, titanium, magnesium, copper, nickel)
    type: git
    url: https://github.com/partcad/std-manufacturing-materials-metals
