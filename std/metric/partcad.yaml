cover:
  package: cqwarehouse

import:
  cqwarehouse:
    desc: Standard metric parts implemented in cq-warehouse
    type: git
    url: https://github.com/partcad/partcad-cqwarehouse/
    relPath: metric.yaml
  bosl2:
    desc: Parametric BOSL2 shapes, gears, threading and hardware (Belfry OpenSCAD Library v2)
    type: git
    url: https://github.com/partcad/partcad-bosl2/
  m:
    desc: Standard M* interfaces
    type: git
    url: https://github.com/partcad/partcad-standard-metric-m/
  nema:
    desc: Standard NEMA* interfaces
    type: git
    url: https://github.com/partcad/partcad-standard-metric-nema/
