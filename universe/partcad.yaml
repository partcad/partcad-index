desc: |
  Packages describing the "universe" of real-world product ecosystems.
cover:
  package: lego

dependencies:
  # The LEGO universe. The LDraw parts library (LEGO-compatible parts) exposed
  # as parametric PartCAD parts, published at //pub/universe/lego/ldraw. Every
  # part names the stores it is bought at as its suppliers, which are
  # registered with the other stores at //pub/svc/commerce: LEGO's Pick a Brick
  # (lego-pick-a-brick), BrickLink (bricklink) and Brick Owl (brickowl).
  lego:
    desc: LEGO parts from the LDraw library, as parametric PartCAD parts
    type: git
    url: https://github.com/partcad/partcad-ldraw/
